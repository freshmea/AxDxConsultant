[project]
name = "crewai-local-gemma"
version = "0.1.0"
description = "Minimal CrewAI smoke test using a llama.cpp Gemma endpoint"
readme = "README.md"
authors = [
    { name = "freshmea", email = "freshmea@naver.com" }
]
requires-python = ">=3.12"
dependencies = [
    "crewai>=1.14.4",
    "crewai-tools>=1.14.4",
    "firecrawl-py>=4.24.1",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

[project.scripts]
crewai-local-gemma = "crewai_local_gemma.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
