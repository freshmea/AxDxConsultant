tasks:
  코드작성:
    description: >
      할인 가격을 계산하는 파이썬 함수를 작성하라.
      함수 이름은 할인_가격_계산 으로 정한다.
      입력은 원가격과 할인율이며, 원가격은 영보다 커야 하고 할인율은 영 이상 백 이하만 허용한다.
      원가격과 할인율이 숫자가 아니면 타입 오류로 처리한다.
      결과는 소수점 둘째 자리까지 반올림한다.
      출력은 짧게 작성하라.
      요구사항 요약, 코드 블록, 정상 예시 두 개, 예외 기준 세 개만 작성하라.
      내부 추론 설명은 쓰지 말고 최종 답변 본문만 작성하라.
    expected_output: >
      한국어 마크다운 문서.
      할인_가격_계산 함수 코드와 검증자가 확인할 수 있는 핵심 기준만 포함되어야 한다.
    agent: 코드작성자
    markdown: 예
    output_file: 출력/작성된_코드.md

  코드검증:
    description: >
      코드작성자가 작성한 할인_가격_계산 함수를 검토하라.
      정상 입력, 할인율 영, 할인율 백, 음수 원가격, 백을 초과한 할인율, 숫자가 아닌 입력을 포함해 테스트 관점을 정리하라.
      코드가 요구사항을 만족하는지 판정하고, 필요한 경우 수정 제안을 작성하라.
      마지막에는 최종 판정을 통과 또는 보완 필요 중 하나로 명확히 적어라.
      내부 추론 설명은 쓰지 말고 최종 답변 본문만 작성하라.
    expected_output: >
      한국어 마크다운 테스트 보고서.
      테스트 표, 예상 결과, 검토 의견, 최종 판정이 포함되어야 한다.
    agent: 코드검증자
    context:
      - 코드작성
    markdown: 예
    output_file: 출력/테스트_검토_보고서.md
